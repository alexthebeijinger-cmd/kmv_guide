<!doctype html>
<!--
  НАПРАВЛЕНИЕ · КМВ Гид · чат-гид (Пятигорск, MVP)

  THESIS: гид выдаёт отмеренную порцию с честным паспортом, а не ленту текста. Отказ и от
  пузырей мессенджера с аватаркой бота, и от портальной сетки муниципального гида.
  OWN-WORLD: питьевая галерея. Светлый травертин как плоскость, тёмная эмаль табличек как
  объекты, латунь линеек и кранов как конструкция, бирюза провальской воды — только «живое
  сейчас», ржавая охра железистого налёта — «требует внимания». Табличка — единственный контейнер.
  STORY: человек между процедурами спрашивает, что делать сегодня; получает порядок дня по
  времени и места с часами, адресом и телефоном; доводит заявку на столик до отправки партнёру.
  FIRST VIEWPORT: полноширинная латунная стойка под шапкой, на двух крючках висит большая
  эмалевая табличка с вопросом «Какие у нас планы на сегодня?» и четырьмя ответами; ниже по камню
  четыре быстрых захода; внизу кран-ввод и честная строка про границу офлайна.
  FORM: мир «Бювет» — третий в собственном списке, назначен жребием (ключ b7b6e4dd); выдачи
  висят на вертикальной оси (композиция Б), первый экран — большая табличка (композиция В).
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Гид по Пятигорску: маршрут на сегодня, места с часами и телефоном, заявка на столик.">
<meta name="theme-color" content="#E4E3DB">
<title>КМВ Гид · Пятигорск</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%2317403F'/%3E%3Cpath d='M10 8h7M12.5 8v8M12.5 16h5a4 4 0 0 1 4 4v2' stroke='%23D8B064' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='26' r='2.6' fill='%232E9B8F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="stage">

  <header class="top">
    <div class="brand">
      <span class="wordmark" data-i18n="wordmark">КМВ Гид · Пятигорск</span>
      <span class="proto" data-i18n="proto" title="Гид ещё не подключён к настоящей базе знаний">Прототип</span>
    </div>
    <div class="lang" role="group" aria-label="Язык / 语言">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hans">简体</button>
    </div>
  </header>

  <p class="offline" role="status">
    <span data-i18n="offlineBanner">Связи нет. Гид отвечать не может, но адреса, телефоны и часы уже загруженных мест на экране остаются.</span>
  </p>

  <main class="feed" id="feed"></main>

  <div class="tap">
    <form class="tap__row" id="askForm" autocomplete="off">
      <input class="tap__input" id="askInput" type="text" data-i18n-placeholder="askPlaceholder"
             placeholder="Спросите гида" aria-label="Спросите гида">
      <button class="tap__go" type="submit" data-i18n-label="send" aria-label="Отправить">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 4h6M8 4v7"/>
          <path d="M8 11h4a3 3 0 0 1 3 3v1.5"/>
          <path d="M15 21c-1.3 0-2.2-1-2.2-2.2 0-1.3 2.2-3.3 2.2-3.3s2.2 2 2.2 3.3C17.2 20 16.3 21 15 21z"/>
        </svg>
      </button>
    </form>
    <p class="honest" data-i18n-html="honest">
      <b>Гид отвечает только со связью.</b> Сохранённый маршрут, адреса и телефоны останутся с вами и без интернета.
    </p>
  </div>

</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="sheet__inner" id="sheetInner"></div>
</div>

<script src="app.js"></script>
</body>
</html>
