<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>В · Один кран — КМВ Гид</title>
<link rel="stylesheet" href="world.css">
<style>
  /* Композиция В: экран отдан одной большой табличке-вопросу. Гид ведёт, а не даёт меню. */
  .main-plate {
    position: relative;
    border-radius: var(--radius);
    padding: var(--s6) var(--s4) var(--s4);
    margin-top: var(--s8);
    background: linear-gradient(180deg, var(--enamel-lit), var(--enamel) 42%, var(--enamel-dark));
    color: var(--engraved);
    box-shadow: var(--shade-plate), var(--edge-enamel);
  }

  /* Табличка висит на полноширинной стойке. */
  .main-plate__hooks {
    position: absolute;
    top: -14px;
    left: 0;
    right: 0;
    height: 14px;
  }
  .main-plate__hooks span {
    position: absolute;
    top: 0;
    width: 2px;
    height: 14px;
    background: linear-gradient(180deg, var(--brass-lit), var(--brass));
  }
  .main-plate__hooks span:first-child { left: 28px; }
  .main-plate__hooks span:last-child { right: 28px; }

  .main-plate__label {
    display: block;
    font-family: var(--display), var(--cjk);
    font-size: .6875rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--water-pale);
    margin-bottom: var(--s3);
  }

  .main-plate__q {
    margin: 0 0 var(--s6);
    font-family: var(--display), var(--cjk);
    font-weight: 700;
    font-size: clamp(1.625rem, 6.4vw, 2.125rem);
    line-height: 1.14;
    letter-spacing: .01em;
    text-shadow: 0 1px 0 rgba(0,0,0,.34);
    text-wrap: balance;
  }

  .answers { display: grid; gap: var(--s2); }

  .answer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--s3);
    width: 100%;
    text-align: left;
    padding: 13px var(--s4);
    border: 1px solid rgba(169,217,209,.34);
    border-radius: var(--radius-in);
    background: rgba(255,255,255,.05);
    color: var(--engraved);
    font-family: var(--body), var(--cjk);
    font-size: 1rem;
    cursor: pointer;
    transition: background .2s var(--ease), border-color .2s var(--ease);
  }
  .answer:hover { background: rgba(169,217,209,.14); border-color: var(--water); }
  .answer:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
  .answer span { color: var(--water-pale); font-size: .8125rem; font-variant-numeric: tabular-nums; }

  .aside {
    margin: var(--s8) 0 var(--s6);
  }
  .aside__label {
    display: flex;
    align-items: center;
    gap: var(--s3);
    font-family: var(--display);
    font-size: .6875rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 var(--s3);
  }
  .aside__label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(168,129,63,.5), transparent);
  }

  /* Второстепенные заходы — не эмаль, а гравировка по камню. */
  .tags { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .tag {
    border: 1px solid var(--brass);
    background: rgba(255,255,255,.26);
    border-radius: var(--radius);
    padding: 9px 12px;
    min-height: 44px;
    text-align: left;
    font-family: var(--body), var(--cjk);
    font-size: .8125rem;
    line-height: 1.3;
    color: var(--ink);
    cursor: pointer;
    transition: background .18s var(--ease), border-color .18s var(--ease);
  }
  .tag:hover { background: rgba(255,255,255,.6); border-color: var(--water-deep); }
  .tag:focus-visible { outline: 2px solid var(--water-deep); outline-offset: 2px; }

  .spacer { flex: 1; min-height: var(--s8); }
</style>
</head>
<body>
<div class="stage">

  <header class="top">
    <span class="wordmark">КМВ Гид · Пятигорск</span>
    <div class="lang" role="group" aria-label="Язык">
      <button type="button" aria-pressed="true">RU</button>
      <button type="button" aria-pressed="false" lang="zh-Hans">简体</button>
    </div>
  </header>

  <hr class="rail rail--full">

  <section class="main-plate">
    <div class="main-plate__hooks" aria-hidden="true"><span></span><span></span></div>
    <span class="main-plate__label">Сегодня · Пятигорск</span>
    <h1 class="main-plate__q">Какие у нас планы на сегодня?</h1>
    <div class="answers">
      <button class="answer" type="button">Ещё не решил — предложи</button>
      <button class="answer" type="button">После процедур, с 14:00 <span>полдня</span></button>
      <button class="answer" type="button">Гуляю весь день <span>8 ч+</span></button>
      <button class="answer" type="button">Проездом, до вечера <span>1 день</span></button>
    </div>
  </section>

  <section class="aside">
    <p class="aside__label">Или сразу</p>
    <div class="tags">
      <button class="tag" type="button">Где поесть рядом</button>
      <button class="tag" type="button">Как добраться от аэропорта</button>
      <button class="tag" type="button">Санаторий по диагнозу</button>
      <button class="tag" type="button">Что посмотреть за день</button>
    </div>
  </section>

  <div class="spacer"></div>

  <div class="tap">
    <div class="tap__row">
      <input class="tap__input" type="text" placeholder="Спросите гида" aria-label="Спросите гида">
      <button class="tap__go" type="button" aria-label="Отправить">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 4h6M8 4v7"/>
          <path d="M8 11h4a3 3 0 0 1 3 3v1.5"/>
          <path d="M15 21c-1.3 0-2.2-1-2.2-2.2 0-1.3 2.2-3.3 2.2-3.3s2.2 2 2.2 3.3C17.2 20 16.3 21 15 21z"/>
        </svg>
      </button>
    </div>
    <p class="honest"><b>Гид отвечает только со связью.</b> Сохранённый маршрут, адреса и телефоны останутся с вами и без интернета.</p>
  </div>

</div>
</body>
</html>
