<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>А · Стойка поперёк — КМВ Гид</title>
<link rel="stylesheet" href="world.css">
<style>
  /* Композиция А: стойка идёт поперёк экрана, таблички висят на ней в ряд. */
  .counter { margin-top: var(--s6); }

  .counter__rail {
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    width: 100vw;
    height: 3px;
    background: linear-gradient(180deg, var(--brass-lit) 0 1px, var(--brass) 1px 3px);
    box-shadow: 0 2px 3px rgba(14,38,36,.22);
  }

  .counter__scroll {
    display: flex;
    gap: var(--s3);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 9px var(--s4) var(--s6);
    margin: 0 calc(var(--s4) * -1);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .counter__scroll::-webkit-scrollbar { display: none; }

  .counter__scroll .plate {
    flex: 0 0 min(72vw, 15rem);
    scroll-snap-align: start;
    min-height: 8.5rem;
    display: flex;
    flex-direction: column;
  }
  .counter__scroll .plate__title { margin-top: auto; }

  .swipe-note {
    display: flex;
    align-items: center;
    gap: var(--s2);
    font-family: var(--display);
    font-size: .6875rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 var(--s2);
  }
  .swipe-note::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(168,129,63,.5), transparent);
  }
  .spacer { flex: 1; }
</style>
</head>
<body>
<div class="stage">

  <header class="top">
    <span class="wordmark">КМВ Гид · Пятигорск</span>
    <div class="lang" role="group" aria-label="Язык">
      <button type="button" aria-pressed="true">RU</button>
      <button type="button" aria-pressed="false" lang="zh-Hans">简体</button>
    </div>
  </header>

  <h1 class="ask">Какие у нас планы на <em>сегодня</em>?</h1>
  <p class="ask-sub">Скажите, сколько времени свободно и что интересно, — соберу маршрут по Пятигорску на сегодня.</p>

  <div class="spacer"></div>

  <section class="counter" aria-label="С чего начать">
    <p class="swipe-note">Стойка · листайте вбок</p>
    <div class="counter__rail"></div>
    <div class="counter__scroll">

      <button class="plate" type="button">
        <span class="plate__hook"></span>
        <span class="plate__label">После процедур</span>
        <h2 class="plate__title">Свободен с 14:00 — что успею</h2>
        <p class="plate__meta">Маршрут под остаток дня</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__hook"></span>
        <span class="plate__label">Рядом</span>
        <h2 class="plate__title">Где поесть</h2>
        <p class="plate__meta">Уточню тип и покажу ближайшие</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__hook"></span>
        <span class="plate__label">Один день</span>
        <h2 class="plate__title">Первый раз в Пятигорске</h2>
        <p class="plate__meta">Главное, если день один</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__hook"></span>
        <span class="plate__label">Дорога</span>
        <h2 class="plate__title">Как добраться от аэропорта</h2>
        <p class="plate__meta">Электричка, автобус, такси</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__hook"></span>
        <span class="plate__label">Лечение</span>
        <h2 class="plate__title">Санаторий по моему диагнозу</h2>
        <p class="plate__meta">По базе «Курортной медицины»</p>
      </button>

    </div>
  </section>

  <div class="spacer"></div>

  <div class="tap">
    <div class="tap__row">
      <input class="tap__input" type="text" placeholder="Спросите гида" aria-label="Спросите гида">
      <button class="tap__go" type="button" aria-label="Отправить">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 4h6M8 4v7"/>
          <path d="M8 11h4a3 3 0 0 1 3 3v1.5"/>
          <path d="M15 21c-1.3 0-2.2-1-2.2-2.2 0-1.3 2.2-3.3 2.2-3.3s2.2 2 2.2 3.3C17.2 20 16.3 21 15 21z"/>
        </svg>
      </button>
    </div>
    <p class="honest"><b>Гид отвечает только со связью.</b> Сохранённый маршрут, адреса и телефоны останутся с вами и без интернета.</p>
  </div>

</div>
</body>
</html>
