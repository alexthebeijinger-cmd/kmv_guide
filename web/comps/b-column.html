<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Б · Проход вдоль галереи — КМВ Гид</title>
<link rel="stylesheet" href="world.css">
<style>
  /* Композиция Б: латунная ось идёт вертикально, таблички крепятся к ней справа. */
  .gallery {
    display: grid;
    grid-template-columns: 22px 1fr;
    margin-top: var(--s6);
  }

  .gallery__rail {
    position: relative;
    justify-self: center;
    width: 3px;
    background: linear-gradient(90deg, var(--brass-lit) 0 1px, var(--brass) 1px 3px);
    box-shadow: 1px 0 2px rgba(14,38,36,.22);
  }
  /* Ось начинается заглушкой сверху и уходит вниз за край экрана. */
  .gallery__rail::before {
    content: "";
    position: absolute;
    top: -5px;
    left: -3.5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(64% 64% at 34% 28%, var(--brass-lit), var(--brass) 70%, #7E5F2A);
    box-shadow: 0 1px 2px rgba(14,38,36,.3);
  }

  .gallery__plates {
    display: flex;
    flex-direction: column;
    gap: var(--s4);
    padding: var(--s2) 0 var(--s4) var(--s4);
  }

  /* Отвод от оси к табличке. */
  .gallery__plates .plate::before {
    content: "";
    position: absolute;
    top: 21px;
    left: calc(var(--s4) * -1);
    width: var(--s4);
    height: 2px;
    background: linear-gradient(180deg, var(--brass-lit) 0 1px, var(--brass) 1px 2px);
  }

  .gallery__plates .plate { padding: var(--s4); }
  .gallery__plates .plate__hook { display: none; }

  .section-label {
    display: flex;
    align-items: center;
    gap: var(--s3);
    font-family: var(--display);
    font-size: .6875rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 var(--s3);
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(168,129,63,.5), transparent);
  }
</style>
</head>
<body>
<div class="stage">

  <header class="top">
    <span class="wordmark">КМВ Гид · Пятигорск</span>
    <div class="lang" role="group" aria-label="Язык">
      <button type="button" aria-pressed="true">RU</button>
      <button type="button" aria-pressed="false" lang="zh-Hans">简体</button>
    </div>
  </header>

  <h1 class="ask">Какие у нас планы на <em>сегодня</em>?</h1>
  <p class="ask-sub">Скажите, сколько времени свободно и что интересно, — соберу маршрут по Пятигорску на сегодня.</p>

  <p class="section-label">С чего начнём</p>

  <section class="gallery" aria-label="С чего начать">
    <div class="gallery__rail" aria-hidden="true"></div>
    <div class="gallery__plates">

      <button class="plate" type="button">
        <span class="plate__label">После процедур</span>
        <h2 class="plate__title">Свободен с 14:00 — что успею</h2>
        <p class="plate__meta">Соберу маршрут под остаток дня</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__label">Рядом</span>
        <h2 class="plate__title">Где поесть</h2>
        <p class="plate__meta">Уточню тип еды и покажу ближайшие места с часами и телефоном</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__label">Один день</span>
        <h2 class="plate__title">Первый раз в Пятигорске</h2>
        <p class="plate__meta">Главное, если день только один</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__label">Дорога</span>
        <h2 class="plate__title">Как добраться от аэропорта</h2>
        <p class="plate__meta">Электричка, автобус, такси — с расписанием</p>
      </button>

      <button class="plate" type="button">
        <span class="plate__label">Лечение</span>
        <h2 class="plate__title">Санаторий по моему диагнозу</h2>
        <p class="plate__meta">По базе «Курортной медицины»</p>
      </button>

    </div>
  </section>

  <div class="tap">
    <div class="tap__row">
      <input class="tap__input" type="text" placeholder="Спросите гида" aria-label="Спросите гида">
      <button class="tap__go" type="button" aria-label="Отправить">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 4h6M8 4v7"/>
          <path d="M8 11h4a3 3 0 0 1 3 3v1.5"/>
          <path d="M15 21c-1.3 0-2.2-1-2.2-2.2 0-1.3 2.2-3.3 2.2-3.3s2.2 2 2.2 3.3C17.2 20 16.3 21 15 21z"/>
        </svg>
      </button>
    </div>
    <p class="honest"><b>Гид отвечает только со связью.</b> Сохранённый маршрут, адреса и телефоны останутся с вами и без интернета.</p>
  </div>

</div>
</body>
</html>
